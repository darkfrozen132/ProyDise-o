# ====================================
# Configuracion de HikariCP (Pool de Conexiones)
# ====================================
# Tamaño mínimo del pool
spring.datasource.hikari.minimum-idle=2

# Tamaño máximo del pool (aumentado para operaciones grandes)
spring.datasource.hikari.maximum-pool-size=20

# Timeout de conexión (30 segundos)
spring.datasource.hikari.connection-timeout=30000

# Tiempo máximo de vida de una conexión (4 minutos - menor que wait_timeout de MySQL RDS)
spring.datasource.hikari.max-lifetime=240000

# Tiempo máximo que una conexión puede estar inactiva (3 minutos)
spring.datasource.hikari.idle-timeout=180000

# Tiempo máximo de una transacción (10 minutos para carga de datos grandes)
spring.transaction.default-timeout=600

# Test de conexión antes de usar
spring.datasource.hikari.connection-test-query=SELECT 1

# Validación de conexiones antes de usarlas
spring.datasource.hikari.validation-timeout=5000
