# Configuracion del servidor
spring.application.name=backend
server.port=8080

# ====================================
# Configuracion de JPA / Hibernate
# ====================================

# DDL: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (deshabilitado para mejor performance)
spring.jpa.show-sql=false

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Habilitar comentarios SQL en los logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Estrategia de naming (snake_case para tablas y columnas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Configuraciones de performance
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Cache de segundo nivel (deshabilitado por defecto)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Estadisticas de Hibernate (solo para desarrollo/debug)
spring.jpa.properties.hibernate.generate_statistics=false

# Validacion automatica del esquema
spring.jpa.properties.hibernate.check_nullability=true

# ====================================
# Configuracion de logging
# ====================================
logging.level.com.proyecto.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.stat=WARN

