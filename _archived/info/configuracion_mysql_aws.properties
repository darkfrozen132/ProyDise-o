# Configuración adicional para MySQL en AWS RDS
# Agrega estas propiedades si sigues teniendo problemas de timeout

# Parámetros adicionales de conexión MySQL
spring.datasource.url=jdbc:mysql://basedatosdp1.cgyrteyzi7pp.us-east-1.rds.amazonaws.com:3306/dp1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true

# Habilitar reconexión automática
spring.datasource.hikari.connection-init-sql=SELECT 1

# Configuración adicional de HikariCP
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000

# Configuración de timeouts a nivel de JDBC
spring.datasource.hikari.data-source-properties.socketTimeout=60000
spring.datasource.hikari.data-source-properties.connectTimeout=60000

# IMPORTANTE: Para batch inserts en MySQL
# rewriteBatchedStatements=true permite que MySQL ejecute múltiples INSERTs en una sola llamada
# Mejora drásticamente la performance
