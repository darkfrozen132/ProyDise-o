<!DOCTYPE html>
<html>
<head>
    <title>Test Planificación WebSocket</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { 
            background: #000; 
            color: #0f0; 
            padding: 10px; 
            height: 600px; 
            overflow-y: scroll;
            white-space: pre-wrap;
        }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        .info { color: #00ff00; }
        .warn { color: #ffff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <h1>🧪 Test Planificación WebSocket</h1>
    <button onclick="conectar()">Conectar y Planificar (1 iteración)</button>
    <button onclick="planificarMultiple()">Planificar 5 iteraciones</button>
    <button onclick="limpiar()">Limpiar logs</button>
    <div id="output"></div>

    <script>
        let websocket = null;
        let iteraciones = 0;
        let maxIteraciones = 1;

        function log(mensaje, tipo = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<span class="${tipo}">[${timestamp}] ${mensaje}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function conectar() {
            maxIteraciones = 1;
            iniciarConexion();
        }

        function planificarMultiple() {
            maxIteraciones = 5;
            iniciarConexion();
        }

        function iniciarConexion() {
            iteraciones = 0;
            log('🔌 Conectando a WebSocket nativo...', 'info');
            
            // WebSocket nativo (no SockJS)
            websocket = new WebSocket('ws://localhost:8000/ws/planificacion');
            
            websocket.onopen = function() {
                log('✅ Conectado al WebSocket', 'info');
                enviarSolicitud();
            };
            
            websocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.tipo === 'PROGRESO') {
                    log(`📊 Generación ${data.generacionActual}/${data.totalGeneraciones} - Fitness: ${data.mejorFitness.toFixed(4)} - Pedidos: ${data.pedidosProcesados}/${data.totalPedidos}`, 'info');
                } else if (data.tipo === 'RESULTADO') {
                    log(`✅ RESULTADO: ${data.pedidosPlanificados} pedidos planificados, ${data.vuelosUnicos} vuelos generados`, 'warn');
                    log(`⏰ Tiempo simulación: ${data.tiempoActualSimulacion}`, 'info');
                    
                    iteraciones++;
                    if (iteraciones < maxIteraciones) {
                        log(`\n🔄 Iniciando iteración ${iteraciones + 1}/${maxIteraciones}...\n`, 'warn');
                        setTimeout(() => enviarSolicitud(), 2000);
                    } else {
                        log(`\n✅ Completadas ${maxIteraciones} iteraciones\n`, 'warn');
                        setTimeout(() => desconectar(), 2000);
                    }
                }
            };
            
            websocket.onerror = function(error) {
                log('❌ Error de conexión: ' + error, 'error');
            };
            
            websocket.onclose = function() {
                log('🔌 Conexión cerrada', 'info');
            };
        }

        function enviarSolicitud() {
            const request = {
                fecha: '2025-01-01',
                factorK: 14,
                maximoVuelos: null
            };
            
            log(`📤 Enviando solicitud de planificación (iteración ${iteraciones + 1})...`, 'info');
            websocket.send(JSON.stringify(request));
        }

        function desconectar() {
            if (websocket !== null) {
                websocket.close();
                log('🔌 Desconectado', 'info');
            }
        }

        function limpiar() {
            document.getElementById('output').innerHTML = '';
        }

        // Desconectar al cerrar la página
        window.onbeforeunload = function() {
            desconectar();
        };
    </script>
</body>
</html>
