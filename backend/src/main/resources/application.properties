# Configuracion del servidor
spring.application.name=backend
server.port=8000

# ====================================
# PERFIL POR DEFECTO: PRODUCCIÓN
# mvn spring-boot:run → usa configuración de producción
# ====================================
spring.profiles.active=prod

# ====================================
# CORS - Permitir todos los orígenes
# ====================================
app.cors.allowed-origins=*

# ====================================
# Configuracion de JPA / Hibernate
# ====================================

# DDL: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (deshabilitado para mejor performance)
spring.jpa.show-sql=false

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Habilitar comentarios SQL en los logs
spring.jpa.properties.hibernate.use_sql_comments=true

# Estrategia de naming (snake_case para tablas y columnas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Configuraciones de performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# IMPORTANTE: Habilitar batch processing para entidades con ID generado
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Optimización para SEQUENCE (mucho más rápido que IDENTITY)
spring.jpa.properties.hibernate.id.optimizer.pooled.prefer_lo=true

# Deshabilitar validaciones automáticas (ganar velocidad en inserción masiva)
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Cache de statements preparados (importante para batch inserts)
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Cache de segundo nivel (deshabilitado por defecto)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Estadisticas de Hibernate (solo para desarrollo/debug)
spring.jpa.properties.hibernate.generate_statistics=false

# Validacion automatica del esquema
spring.jpa.properties.hibernate.check_nullability=true

# ====================================
# Configuracion de Spring DevTools
# ====================================
# IMPORTANTE: Deshabilitar auto-reload para no matar simulaciones largas
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ====================================
# Configuracion de logging
# ====================================
logging.level.com.proyecto.backend=INFO
logging.level.com.proyecto.backend.service.VueloTrackingService=DEBUG
logging.level.com.proyecto.backend.planificador=INFO
logging.level.com.proyecto.backend.planificador.semanal.service.AlgoritmoGeneticoService=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.stat=WARN

